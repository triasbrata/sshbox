  guard: manual
  why: "LC_SSHBOX_KEY and LC_SSHBOX_HOST_ID are sent only when a relay key exists (session_manager.dart), and a relay key needs FCM. The gate's emulator is the google_apis image, with no Google Play Services and so no FCM: those two are never sent there, and a flow would fail for a reason that says nothing about the build, or pass having proved nothing. The channel itself is exercised on every connect, since LC_SSHBOX_HYPERLINKS=1 is sent always through the same mechanism -- just not this feature's own values. Checkable on a device with Play Services by echoing $LC_SSHBOX_HOST_ID in a shell"

