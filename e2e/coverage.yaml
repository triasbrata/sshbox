# What guards each feature the user has passed.
#
# CLAUDE.md's Features table is what this app promises. A row reading
# "UAT passed" is a promise the user checked themselves, and this file says,
# for every one of them, what would catch it breaking. `tool/e2e_coverage.py`
# fails when a passed feature is missing here, so the list cannot quietly rot.
#
# guard:
#   e2e-android  a .maestro/ flow drives the real app on a device
#   e2e-desktop  an integration_test/ test drives the real desktop app
#   unit         widget or unit tests under test/ already reach it; an e2e
#                flow would be slower and prove no more
#   manual       cannot be automated on a runner -- `why` says what stops it
#   todo         decided to need e2e, not built yet; counted in every report
#
# The bias is deliberate: e2e only where the real platform is load-bearing --
# a real IME, a real intent, a real Activity, a real pty, a real SSH server.
# 813 widget tests already cover the logic, and a slow flaky flow that re-proves
# them is a worse guard than the test it duplicates, because it blocks releases.
#
# Suite-level caveat, true of every e2e-android entry below: the Maestro flows
# need a seeded host with a stored credential and a known-hosts entry before
# they pass on a clean runner. See .maestro/seed_host.yaml.

