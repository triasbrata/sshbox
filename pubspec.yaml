name: sshbox
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.15+15

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  xterm2: ^5.2.0
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  app_links: ^7.2.1
  flutter_local_notifications: ^22.3.0
  file_picker: ^12.2.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_foreground_task: ^11.0.3
  url_launcher: ^6.3.2
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  webview_flutter: ^4.14.1
  toastification: ^3.2.0
  flutter_markdown_plus: ^1.0.12
  # Already here under flutter_markdown_plus, whose builders take its nodes.
  markdown: ^7.3.1
  # Already here under dartssh2, pure Dart: signs relay requests with each
  # host's P-256 key.
  pointycastle: ^4.0.0
  # Already here under uuid, pure Dart: SCRAM and MD5 for the database
  # browser's PostgreSQL and MongoDB sign-ins.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Already here under url_launcher; named so tests can stand in for it.
  url_launcher_platform_interface: ^2.3.2
  # The same, under webview_flutter: no web view runs under flutter test.
  webview_flutter_platform_interface: ^2.15.1
  # Draws the launcher icon from the flutter_launcher_icons block below.
  flutter_launcher_icons: ^0.14.4

# The launcher icon, Android (legacy and adaptive) and iOS, from the tile in
# assets/branding/app_icon.png: a 500 px squircle centred in a 512 px image,
# with a 6 px transparent margin. iOS takes assets/branding/app_icon_ios.png,
# cut from the same tile with
#   ffmpeg -i assets/branding/app_icon.png -vf "crop=432:432:40:40,format=gbrp,scale=1024:1024:flags=lanczos+accurate_rnd,format=rgb24" assets/branding/app_icon_ios.png
# After changing the tile or these values, run
#   dart run flutter_launcher_icons
# and commit what it writes under android/app/src/main/res and
# ios/Runner/Assets.xcassets/AppIcon.appiconset. Undo its change to
# ios/Runner.xcodeproj/project.pbxproj: 0.14.4 sets every ASSETCATALOG_*
# setting to AppIcon, including GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = YES.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_foreground: assets/branding/app_icon.png
  # The violet-blue denim just inside the tile's edge (its average all round).
  adaptive_icon_background: "#373964"
  # 14% a side draws the image at 77.8 of the 108 dp layer, so the tile's
  # straight edges fall 2 dp past the 72 dp a launcher shows, and its rounded
  # corners stay outside a circle mask and outside a rounded-square mask whose
  # corner radius is 16% of the side or more. The whole pocket still fits
  # inside a circle mask, 2 dp clear of its edge. At 15% the tile's corners
  # show under a rounded square below a 20% radius, and at 16% its transparent
  # margin shows under every mask.
  adaptive_icon_foreground_inset: 14
  # iOS wants a full-bleed square with no alpha (the App Store rejects alpha on
  # the 1024 icon) and draws its own continuous corners over it. So the iOS
  # source is the tile cropped 40 px in from each side, inside its rounded
  # corners, so denim fills the whole square and the pocket stays whole, then
  # upscaled from 432 to 1024 px with Lanczos. It is RGB, so remove_alpha_ios
  # is only a guard.
  image_path_ios: assets/branding/app_icon_ios.png
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # The Markdown preview's Mermaid diagrams (lib/src/ui/mermaid_view.dart):
  # the page, its script, and dist/mermaid.min.js from the npm package
  # mermaid 11.17.2, MIT, with its LICENSE.
  assets:
    - assets/mermaid/

  # The terminal's fonts, picked in Settings (lib/src/ui/settings_page.dart,
  # which names them by these families). Static Regular and Bold only; each
  # folder holds its SIL OFL 1.1 license.
  fonts:
    - family: Cascadia Mono
      fonts:
        - asset: assets/fonts/cascadia-mono/CascadiaMono-Regular.ttf
        - asset: assets/fonts/cascadia-mono/CascadiaMono-Bold.ttf
          weight: 700
    - family: Cascadia Code
      fonts:
        - asset: assets/fonts/cascadia-code/CascadiaCode-Regular.ttf
        - asset: assets/fonts/cascadia-code/CascadiaCode-Bold.ttf
          weight: 700
    - family: CaskaydiaCove Nerd Font Mono
      fonts:
        - asset: assets/fonts/caskaydia-cove-nerd-font-mono/CaskaydiaCoveNerdFontMono-Regular.ttf
        - asset: assets/fonts/caskaydia-cove-nerd-font-mono/CaskaydiaCoveNerdFontMono-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Fira Code
      fonts:
        - asset: assets/fonts/fira-code/FiraCode-Regular.ttf
        - asset: assets/fonts/fira-code/FiraCode-Bold.ttf
          weight: 700
