# tool/test_release_flow.sh, tool/e2e_coverage.py, flutter analyze and
# flutter test on every pull request and every push to main. `check` is the status the main branch
# ruleset asks a pull request for. On main, `badge` then publishes the tests'
# line coverage for the README's badge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's new push replaces its old run; every commit on main keeps
# its own, since pushes to main come several a minute.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as a merge commit: its first parent
          # is the base the diff below is taken against.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # The release flow's own steps, and every call of one workflow from
      # another that GitHub would refuse to start. A workflow GitHub refuses
      # fails no job of its own -- the run just never starts -- so this is
      # where it shows. PyYAML reads the workflows.
      - name: Release flow
        run: |
          python3 -c 'import yaml' 2> /dev/null ||
            { sudo apt-get install -yq python3-yaml ||
              { sudo apt-get update -q && sudo apt-get install -yq python3-yaml; }; } > /dev/null
          tool/test_release_flow.sh

      # Every feature the user has passed in CLAUDE.md must say what guards it
      # in e2e/coverage.yaml, so none can quietly lose its guard. Red here
      # means a row reads "UAT passed" with no entry: add one in the same
      # commit -- `guard: todo` is always legal -- and the e2e session refines
      # it. A THIN entry (unit tests that never build a widget) is reported
      # and does not fail: it is a prompt to look, not a verdict. Stdlib only.
      - name: Every passed feature has a guard
        run: python3 tool/e2e_coverage.py

      - uses: ./.github/actions/flutter
        timeout-minutes: 15
      - run: flutter analyze
      # The *_live_test files skip themselves: no SSH server, database or
      # tmux runs here.
      - run: flutter test --coverage

      # The share of lib/'s lines the tests run, from the lcov file flutter
      # test writes: on the run's summary, and on main, the README's badge.
      # ponytail: lcov lists only the files some test loads, so a file no
      # test imports at all is left out rather than counted as 0%.
      - name: Coverage
        id: coverage
        run: |
          pct=$(awk -F: '/^LF:/ { lf += $2 } /^LH:/ { lh += $2 }
            END { if (lf) printf "%.1f", 100 * lh / lf }' coverage/lcov.info)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Line coverage of \`lib/\`: **${pct:-unmeasured}%**" >> "$GITHUB_STEP_SUMMARY"

      # A pull request's changed lib/ lines that no test hits, for the e2e
      # steps to reach. A report: it never fails the job. Printed to the log
      # too, since the API gives no way to read a job summary.
      - name: Changed lines no test runs
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git diff -U0 HEAD^1 HEAD -- lib > "$RUNNER_TEMP/pr.diff"
          python3 tool/uncovered_changed_lines.py coverage/lcov.info "$RUNNER_TEMP/pr.diff" | tee -a "$GITHUB_STEP_SUMMARY"

  # The README's coverage badge. shields.io draws it from coverage.json on the
  # `badges` branch, which holds nothing else and which this job replaces
  # with a single commit on every push to main; no ruleset covers it. Only
  # the run for main's newest commit writes it, so a slower run for an older
  # commit never puts an older number back.
  badge:
    needs: check
    if: github.event_name == 'push' && needs.check.outputs.coverage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - name: Publish the coverage badge
        env:
          GH_TOKEN: ${{ github.token }}
          PCT: ${{ needs.check.outputs.coverage }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $head; its own run publishes the badge"
            exit 0
          fi
          color=$(awk -v p="$PCT" 'BEGIN { print p >= 90 ? "brightgreen" : p >= 80 ? "green" :
            p >= 70 ? "yellowgreen" : p >= 60 ? "yellow" : p >= 50 ? "orange" : "red" }')
          mkdir "$RUNNER_TEMP/badge" && cd "$RUNNER_TEMP/badge"
          git init -q -b badges
          jq -n --arg m "$PCT%" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: $m, color: $c}' > coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Coverage $PCT% at $GITHUB_SHA"
          gh auth setup-git
          git push -qf "https://github.com/$GITHUB_REPOSITORY.git" badges
          echo "coverage $PCT% ($color) for $GITHUB_SHA"

  # The Kotlin unit tests of android/app, which no other job runs: the native
  # crash scrub (NativeCrashesTest) that keeps a SIGSEGV's report to the
  # allowlist. Reported beside `check`, not required by the ruleset. Flutter
  # does not make android/gradlew (git ignores it), so Gradle is the version
  # gradle-wrapper.properties names, unpacked here.
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/flutter
        timeout-minutes: 15

      # The engine's Android jars, which the Flutter Gradle plugin compiles
      # against; pub get leaves them out.
      - run: flutter precache --android

      - name: Restore Gradle's downloads
        id: gradle
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Gradle
        run: |
          v=$(sed -n 's|.*gradle-\(.*\)-all.zip|\1|p' android/gradle/wrapper/gradle-wrapper.properties)
          curl -fsSL "https://services.gradle.org/distributions/gradle-$v-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$v/bin" >> "$GITHUB_PATH"

      - name: Android unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --tests 'dev.triasbrata.sshbox.NativeCrashesTest'

      - name: Result
        if: always()
        run: |
          tests=0; failures=0
          for f in android/app/build/test-results/testDebugUnitTest/*.xml; do
            [ -e "$f" ] || continue
            tests=$((tests + $(sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)))
            failures=$((failures + $(sed -n 's/.*<testsuite [^>]*failures="\([0-9]*\)".*/\1/p' "$f" | head -1) + $(sed -n 's/.*<testsuite [^>]*errors="\([0-9]*\)".*/\1/p' "$f" | head -1)))
          done
          if [ "$tests" -gt 0 ] && [ "$failures" -eq 0 ]; then
            echo "✅ android-unit: $tests tests passed" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ android-unit: $tests tests, $failures failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
