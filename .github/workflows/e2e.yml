# The end-to-end gate: a release candidate is driven as a real app before it
# is allowed to become a release. tag.yml calls this with the rc tag it has
# just made, and promotes that commit only if this succeeds.
#
# **The body of the `run` job belongs to the e2e session, not to the release
# pipeline.** What this file guarantees the pipeline, and what must survive
# any rewrite of it, is only this:
#
#   - it takes `tag` (the rc tag to check out) and `version` (the X.Y.Z+N to
#     write into that checkout's pubspec.yaml, since main's line only sets
#     X.Y);
#   - it succeeds when every flow passed and fails otherwise, because that is
#     the whole gate: a failure promotes nothing and publishes nothing;
#   - it sets the `coverage` output to the percentage of lines of `lib/` the
#     flows reached, or leaves it empty when that could not be measured. An
#     unmeasured run is not a failed one.
#
# Nothing here publishes a build: the rc is built to be driven and thrown
# away. Only release.yml's own build, made from the promoted tag, is ever
# kept.
name: E2E

on:
  workflow_call:
    inputs:
      tag:
        description: The rc tag to check out and drive
        type: string
        required: true
      version:
        description: X.Y.Z+N, written into this checkout's pubspec.yaml
        type: string
        required: true
    outputs:
      coverage:
        description: Percentage of lines of lib/ the flows reached, or empty
        value: ${{ jobs.run.outputs.coverage }}
  workflow_dispatch:
    inputs:
      tag:
        description: A tag to drive; empty is main as it stands
        type: string
        default: ''
      version:
        description: X.Y.Z+N to build as
        type: string
        default: ''
      only:
        description: Run every job, or one of them alone
        type: choice
        options: [all, android, linux-desktop, windows-desktop, macos-desktop]
        default: all
      block:
        description: One Android block to run alone after seed_host, or empty for every flow
        type: string
        default: ''

permissions:
  contents: read

# No concurrency group, on purpose. Each run has a runner, an emulator and an
# sshd of its own and shares nothing with any other, so there is nothing to
# serialise -- and a group is a hazard here. GitHub keeps one run pending per
# group and cancels it when another queues, so one group for tag.yml's calls
# and hand runs alike let a hand run cancel a release candidate's pending
# gate: no promotion, and, the gate being cancelled rather than failed, no
# issue either. tag.yml's own `concurrency: tag` is what orders releases.

jobs:
  run:
    # A hand run may ask for one desktop job alone, which is minutes rather
    # than the emulator's half hour; tag.yml's call passes no `only`, so the
    # release gate always runs this, and every other job too.
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-latest
    # The full Android suite outgrew an hour: v1.0.103's gate was cancelled at
    # 60 minutes mid-way through its report-only flows, which skipped promote
    # without failing anything. ponytail: one job runs every flow, so each
    # report-only flow added lengthens every release; split them into a
    # parallel job when this ceiling nears.
    timeout-minutes: 120
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # main's version line only sets X.Y, so the build under test carries the
      # number the release would carry, in this runner's copy only.
      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.orig "s/^version: .*/version: $VERSION/" pubspec.yaml && rm pubspec.yaml.orig

      # ----------------------------------------------------------------------
      # Everything from here to the coverage step is the e2e session's, and
      # the pipeline deliberately says nothing about what is in it. Which
      # platform the candidate is driven on, what drives it, and what it is
      # driven against are that session's to decide and the user's to settle;
      # more than one suite can live here as long as one pass or fail and one
      # coverage number come out the other end.
      #
      # Until something lands this fails, and so nothing is promoted. That is
      # the safe direction to be unfinished in: a gate that passed by default
      # would publish every release untested.
      # ----------------------------------------------------------------------
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/flutter
        timeout-minutes: 15

      # Debug, not release: it carries every ABI, so the emulator's x86_64 is in
      # it without guessing, and it needs no signing key, since this build is
      # driven and thrown away. release.yml builds what ships.
      # Gradle's downloads -- its own distribution and every Maven artifact
      # the Android build pulls -- from main's cache: uncached they cost each
      # run most of the 250-380 s the debug build takes.
      - name: Restore Gradle's downloads
        id: gradle
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # Gradle's build cache too: 338 s with it empty, 213 s restored.
      - uses: ./.github/actions/gradle-build-cache
        timeout-minutes: 10
        with:
          name: Linux

      - run: flutter build apk --debug
        env:
          GRADLE_OPTS: -Dorg.gradle.caching=true

      - uses: ./.github/actions/gradle-build-cache
        timeout-minutes: 10
        with:
          name: Linux
          save: 'true'

      # Saved from main alone, as every cache here is.
      - name: Save Gradle's downloads
        if: github.ref == 'refs/heads/main' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle.outputs.cache-primary-key }}

      # The host the flows connect to: this runner's own sshd, which the
      # emulator reaches as 10.0.2.2 -- its alias for the host's loopback.
      # A throwaway user with a throwaway password, both made here and gone
      # with the runner. tmux for the chat flow that types into a session's
      # pane.
      - name: Install the sshd, sshpass and tmux
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          args: -y -qq openssh-server sshpass tmux

      - name: Start an sshd for the flows
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          sudo useradd -m -s /bin/bash e2e
          echo "e2e:$password" | sudo chpasswd
          # Loopback only: the emulator arrives there, and nothing else should.
          # Cloud images switch password logins off in a drop-in of their own,
          # so this one is named to sort last and win.
          printf 'ListenAddress 127.0.0.1\nPasswordAuthentication yes\n' |
            sudo tee /etc/ssh/sshd_config.d/99-e2e.conf >/dev/null
          # Ubuntu 24.04 starts sshd from ssh.socket, which listens on every
          # address whatever ListenAddress says. The service reads the config.
          sudo systemctl disable --now ssh.socket 2>/dev/null || true
          sudo systemctl restart ssh
          # Through GITHUB_ENV, not a step output: GitHub drops any output
          # holding a masked value, so the flows would get an empty password.
          echo "SSH_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SSH_USER=e2e" >> "$GITHUB_ENV"
          # Prove it here, in seconds, rather than learn it from the emulator
          # ten minutes later as a seed flow that could not sign in.
          sshpass -p "$password" ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null e2e@127.0.0.1 true
          echo "sshd answers on 127.0.0.1:22 and the password works"

      # The emulator needs hardware acceleration, which a GitHub runner has but
      # does not hand to an unprivileged user until this rule says so.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Maestro, pinned so a new release can't change a run underneath it, and
      # kept: its installer fetched the latest release on every run.
      - name: Restore Maestro
        id: maestro
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.maestro/bin
            ~/.maestro/lib
          key: maestro-${{ runner.os }}-2.11.0

      - name: Install Maestro
        if: steps.maestro.outputs.cache-hit != 'true'
        env:
          MAESTRO_VERSION: 2.11.0
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      # The key names 2.11.0, so only 2.11.0 may be saved under it.
      - name: Check Maestro's version
        if: steps.maestro.outputs.cache-hit != 'true'
        run: |
          version=$("$HOME/.maestro/bin/maestro" --version 2>/dev/null | tail -1 | tr -d '[:space:]')
          [ "$version" = 2.11.0 ] || { echo "::error::installed Maestro $version, not 2.11.0"; exit 1; }

      - name: Save Maestro
        if: github.ref == 'refs/heads/main' && steps.maestro.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.maestro/bin
            ~/.maestro/lib
          key: maestro-${{ runner.os }}-2.11.0

      - run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The system image the emulator boots, kept between runs. Without this it
      # is fetched from Google on every release, and once in the gate's first
      # eight runs it arrived corrupt -- "Error on ZipFile unknown archive" --
      # so no emulator started. On an rc, a build that was fine would have
      # failed the gate, gone unpromoted and had an issue opened against it.
      - name: Restore the emulator's system image
        id: sysimg
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: sysimg-android-34-google_apis-x86_64-v1

      # A no-op on a cache hit. On a miss the image is fetched here, where a
      # corrupt download can be fetched again, rather than inside the emulator
      # step, where it ends the run.
      - name: Install the system image
        run: |
          image="system-images;android-34;google_apis;x86_64"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Not `yes | sdkmanager --install` in the loop: this shell runs with
          # pipefail, and `yes` dies of SIGPIPE when sdkmanager exits, so even
          # a good install would read as failed. Accept the licences once,
          # SIGPIPE expected and ignored, and install without a pipe.
          yes | "$sdk" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if "$sdk" --install "$image" >/dev/null; then
              echo "system image ready (attempt $attempt)"
              exit 0
            fi
            echo "::warning::system image download failed (attempt $attempt); fetching again"
            sleep 15
          done
          echo "::error::could not install $image after 3 attempts"
          exit 1

      # Each line of `script` runs in a shell of its own, so the whole of the
      # logic lives in tools/e2e_android.sh: which flows gate, which only
      # report, and seed_host first.
      - name: Save the emulator's system image
        if: github.ref == 'refs/heads/main' && steps.sysimg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: sysimg-android-34-google_apis-x86_64-v1

      - name: The flows
        uses: reactivecircus/android-emulator-runner@v2
        # Empty unless a hand run names one block (tools/e2e_android.sh);
        # tag.yml's call has no such input, so the gate runs every flow.
        env:
          E2E_ONLY: ${{ inputs.block }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: tools/e2e_android.sh

      # What Maestro saw when a flow failed: its screenshots, and nothing else.
      #
      # An allowlist, not the whole folder, and that is load-bearing. Maestro
      # writes every variable it defines into maestro.log in plain text, and
      # every string it types into commands.json -- the sshd password among
      # them. GitHub masks the job's log, never an uploaded file, and on this
      # public repository an artifact is downloadable by anyone signed in. The
      # first run of this gate uploaded the whole folder and put the password
      # there; it was a throwaway on a runner already gone, and the artifact
      # was deleted, but the next one would not be. A screenshot shows a
      # password field as dots.
      # Evidence: screenshots a flow took on purpose, pass or fail, so a feature
      # can be shown working rather than only reported green -- the chat's
      # version check, say, which the user has no host to try it on. PNGs
      # alone, for the same reason as the failure artifact below. Kept longer,
      # since someone has to look at them.
      - name: Keep the evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: build/e2e-evidence/*.png
          retention-days: 30
          if-no-files-found: ignore

      # always(), not failure(): a report-only flow that fails does not fail the
      # job, so failure() never uploaded its screenshots, and those failures were
      # the ones with nothing to look at. Maestro only takes these on a failed
      # step, so a run where every flow passed still uploads none.
      - name: Keep Maestro's screenshots of a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ github.run_id }}
          path: ~/.maestro/tests/**/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      # Read by tag.yml: it goes in the promotion's log line, and in the issue
      # when the gate fails. An empty value means it could not be measured,
      # which is not a failure.
      - name: Coverage
        id: coverage
        if: always()
        run: echo "pct=" >> "$GITHUB_OUTPUT"

  # The desktop build, driven on the real Linux GTK embedder under Xvfb:
  # integration_test/, through tools/e2e_desktop.sh. Nothing under test/ ever
  # loads a real desktop embedder -- flutter test reports Android -- so this is
  # the only place the Linux build is driven as it ships.
  #
  # continue-on-error, deliberately. A job that fails in a called workflow fails
  # the whole of it, and this workflow is the release gate: a new job would gate
  # releases the moment it landed. It reports until it has been green a while,
  # as every new check here does, and joins the gate only by choice.
  desktop:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux-desktop' }}
    # The release's Linux build runs on 22.04 (release.yml), so this does too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.orig "s/^version: .*/version: $VERSION/" pubspec.yaml && rm pubspec.yaml.orig

      # The Linux build's own dependencies, exactly as release.yml installs
      # them; xvfb and dbus-x11 to run it with no display, gnome-keyring for
      # the Secret Service a desktop session has, tmux, which the Local shell
      # uses where the machine has it, xclip, which reads a picture off an X11
      # clipboard for a paste, dunst, the notification server a desktop
      # session has, xdotool, which clicks and drags the window as a person
      # would and drags files onto it, Python's GTK, for the small
      # window the files are dragged from, and openbox, the window manager the
      # window-buttons test starts to maximize a window under Xvfb, with
      # x11-utils' xwininfo to find where the window is, and ffmpeg, which
      # grabs the display as evidence for a person to look at.
      - name: Install the Linux build and Xvfb
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          args: >-
            -yq clang cmake ninja-build pkg-config libgtk-3-dev
            liblzma-dev libstdc++-12-dev libsecret-1-dev xvfb dbus-x11 gnome-keyring
            tmux xclip dunst xdotool python3-gi gir1.2-gtk-3.0 openbox x11-utils ffmpeg

      # A host for the chat-drop test: this runner's own sshd on loopback,
      # a throwaway user and password made here and gone with the runner, as
      # the Android job does. The test reads SSH_USER and SSH_PASSWORD.
      - name: Install the sshd
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          args: -y -qq openssh-server

      - name: Start an sshd for the drop test
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          sudo useradd -m -s /bin/bash e2e
          echo "e2e:$password" | sudo chpasswd
          printf 'ListenAddress 127.0.0.1\nPasswordAuthentication yes\n' |
            sudo tee /etc/ssh/sshd_config.d/99-e2e.conf >/dev/null
          sudo systemctl disable --now ssh.socket 2>/dev/null || true
          sudo systemctl restart ssh
          echo "SSH_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SSH_USER=e2e" >> "$GITHUB_ENV"
          for i in $(seq 20); do
            (exec 3<>/dev/tcp/127.0.0.1/22) 2>/dev/null && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/22) 2>/dev/null || { echo "::error::sshd did not start"; exit 1; }
          echo "sshd answers on 127.0.0.1:22"

      - uses: ./.github/actions/flutter
        timeout-minutes: 15

      # Built to take updates from a feed the updater test serves on this
      # runner's loopback, as an older version, so there is something newer
      # to offer. The feed override is read by debug builds alone, never a
      # release.
      - name: Drive the desktop build
        timeout-minutes: 22
        env:
          E2E_SHOTS: ${{ runner.temp }}/shots
        run: |
          feed=http://127.0.0.1:47719
          tools/e2e_desktop.sh linux \
            --dart-define=JEANSH_UPDATE_HOST=$feed \
            --dart-define=JEANSH_UPDATE_FEED=$feed/latest.json \
            --dart-define=JEANSH_VERSION=1.0.0+1

      # #136: Download once more on a session bus with no XDG portal at all,
      # as on a desktop that runs none, where file_picker could not save.
      - name: Download with no XDG portal
        timeout-minutes: 5
        if: always()
        run: |
          JEANSH_E2E_NO_PORTAL=1 tools/e2e_desktop.sh linux \
            --plain-name 'Download saves through the save dialog'

      # What a test grabbed of the display: evidence, kept a week.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

  # macOS: the Cocoa embedder in the runner's own login session -- a window
  # nobody looks at, which is as headless as a Mac gets. Report-only, as the
  # Linux job is, and on every release: tag.yml waits on it, but at about ten
  # minutes it is done well inside the emulator's half hour.
  desktop-macos:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'macos-desktop' }}
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.orig "s/^version: .*/version: $VERSION/" pubspec.yaml && rm pubspec.yaml.orig

      - uses: ./.github/actions/flutter
        timeout-minutes: 15

      # tmux, which the Local shell uses where the machine has it: the image
      # has Homebrew but not tmux.
      - run: brew install tmux
        timeout-minutes: 5

      # The same feed as Linux, so the updater and the Jeansh menu's Check for
      # Updates… have a newer release to find.
      - name: Drive the desktop build
        timeout-minutes: 30
        run: |
          feed=http://127.0.0.1:47719
          tools/e2e_desktop.sh macos \
            --dart-define=JEANSH_UPDATE_HOST=$feed \
            --dart-define=JEANSH_UPDATE_FEED=$feed/latest.json \
            --dart-define=JEANSH_VERSION=1.0.0+1

  # Windows: the Win32 embedder in the runner's own session, as on macOS.
  # Report-only, on every release. Its Local shell is PowerShell under
  # ConPTY, so the tests that drive sh skip there, each saying why.
  desktop-windows:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'windows-desktop' }}
    runs-on: windows-latest
    timeout-minutes: 50
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.orig "s/^version: .*/version: $VERSION/" pubspec.yaml && rm pubspec.yaml.orig

      - uses: ./.github/actions/flutter
        timeout-minutes: 15

      - name: Drive the desktop build
        timeout-minutes: 38
        run: |
          feed=http://127.0.0.1:47719
          tools/e2e_desktop.sh windows \
            --dart-define=JEANSH_UPDATE_HOST=$feed \
            --dart-define=JEANSH_UPDATE_FEED=$feed/latest.json \
            --dart-define=JEANSH_VERSION=1.0.0+1
