# Releases a v* tag's commit: called by tag.yml with the tag it just made,
# or by hand from the Actions tab, with a tag to release again or none for
# main as it stands. `version` reads the release's number from the tag,
# "Jeansh X.Y.Z, build N", and every build writes it into its own copy of
# pubspec.yaml. Mobile goes straight to its store: `android` runs
# tool/release.sh --publish, which releases on Play's closed testing track (by
# hand it is a --dry-run unless told otherwise). Desktop goes to R2: `desktop`
# builds Linux, Windows and macOS and keeps them in a private bucket, and
# nowhere else. `feed` then publishes latest.json, the metadata a desktop
# build reads to find its update, on the tag's GitHub release — the one thing
# this repository publishes, and it carries no build. Then `notes` has the
# release notes written, in English and Indonesian, for
# jeansh.brata.cloud/releases. The secrets live in the
# `release` environment, which only a workflow running on main can reach.
# README.md, Releasing.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: A v* tag to release again; empty is main as it stands
        type: string
        default: ''
      dry_run:
        description: Android - everything but the commit that reaches testers
        type: boolean
        default: true

permissions:
  contents: read

concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
      label: ${{ steps.v.outputs.name }}+${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq 'select(.object.type == "tag") | .object.sha')
            [ -n "$object" ] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
            build=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq .message |
              sed -n 's/^Jeansh .*, build \([0-9][0-9]*\)$/\1/p' | head -n 1)
            name=${TAG#v}
          else
            # By hand with no tag: pubspec.yaml's line on main as it stands.
            line=$(sed -n 's/^version: *//p' pubspec.yaml)
            name=${line%+*}
            build=${line#*+}
          fi
          [ -n "$build" ] || { echo "::error::no build number for ${TAG:-main}"; exit 1; }
          echo "$name, build $build"
          { echo "name=$name"; echo "build=$build"; } >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The release's number, committed in this runner only: tool/release.sh
      # builds from a clean tree, and main's pubspec.yaml only sets X.Y.
      - name: Set the version
        env:
          VERSION: ${{ needs.version.outputs.label }}
        run: |
          sed -i.orig "s/^version: .*/version: $VERSION/" pubspec.yaml && rm pubspec.yaml.orig
          git diff --quiet pubspec.yaml ||
            git -c user.name=CI -c user.email=ci@invalid commit -q -m "Version $VERSION" pubspec.yaml

      # AGP 9 and Gradle 9 need JDK 17 or newer; release.sh needs its keytool.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2 # .fvmrc
          channel: stable
          cache: true

      # compileSdk 37 resolves to the minor-versioned platform android-37.0.
      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0' > /dev/null

      - run: flutter pub get

      - name: Write the signing config and the Play key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for secret in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_KEY; do
            [ -n "$(printenv "$secret")" ] || { echo "::error::The secret behind $secret is not set"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printenv PLAY_KEY > "$RUNNER_TEMP/play.json"
          # A Java properties file: a backslash in a password would need doubling.
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Build and publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play.json
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: tool/release.sh --publish $DRY_RUN

      - name: Remove the signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json" android/key.properties

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
    name: desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The release's number, in this runner's copy only.
      - name: Set the version
        env:
          VERSION: ${{ needs.version.outputs.label }}
        run: |
          sed -i.orig "s/^version: .*/version: $VERSION/" pubspec.yaml && rm pubspec.yaml.orig

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2 # .fvmrc
          channel: stable
          cache: true

      - name: Install the Linux build's packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev

      # Each lands in dist/<X.Y.Z+N>/ as the scripts package it by hand.
      - name: Build
        env:
          LABEL: ${{ needs.version.outputs.label }}
          # Where this build looks for its updates, baked in by both build
          # scripts. A repository variable, not a secret: it is a public URL,
          # and `strings` on any build shows it. Unset leaves the updater off.
          JEANSH_UPDATE_HOST: ${{ vars.JEANSH_UPDATE_HOST }}
        run: |
          case ${{ matrix.target }} in
            linux) tools/build_desktop.sh --skip-checks linux ;;
            macos) tools/build_apple.sh --skip-checks macos ;;
            # tools/build_desktop.sh builds Windows from WSL; here is Windows
            # itself, so the same build and the same zip, by hand.
            windows)
              # The same two defines the build scripts pass, by hand here.
              defines=(--dart-define "JEANSH_VERSION=$LABEL")
              [ -z "${JEANSH_UPDATE_HOST:-}" ] ||
                defines+=(--dart-define "JEANSH_UPDATE_HOST=$JEANSH_UPDATE_HOST")
              flutter build windows --release "${defines[@]}"
              name="Jeansh-$LABEL"
              cp -r build/windows/x64/runner/Release "$RUNNER_TEMP/$name"
              mkdir -p "dist/$LABEL"
              (cd "$RUNNER_TEMP" && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/$LABEL/$name-windows-x64.zip" "$name")
              (cd "dist/$LABEL" && sha256sum -- * > SHA256SUMS) ;;
          esac

      # Into a private bucket, and nowhere else: no Actions artifact, no GitHub
      # release, and nothing in this public log names the bucket or an object.
      # Only the latest build is kept: desktop/<target>/ is synced with
      # --delete, so the release before's files go as this one's arrive. So
      # only a tag's real release lands there; a dry run or main as it stands
      # builds, and keeps nothing.
      - name: Keep the build in R2
        if: inputs.tag != '' && !inputs.dry_run
        env:
          LABEL: ${{ needs.version.outputs.label }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for secret in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            [ -n "$(printenv "$secret")" ] || { echo "::error::The secret behind $secret is not set"; exit 1; }
          done
          aws s3 sync --delete --only-show-errors --endpoint-url "$R2_ENDPOINT" \
            "dist/$LABEL" "s3://$R2_BUCKET/desktop/${{ matrix.target }}/"

  # The feed the desktop builds read to find their update: latest.json, on
  # the tag's own GitHub release. Metadata only — file names, sizes and
  # SHA-256s, and a path under the host each build has baked in, never a URL
  # and never the host itself — so the release carries nothing to download and
  # says nothing about where the builds are served from. The sizes and hashes
  # are read back out of R2, so they describe the objects that are really
  # there rather than what this run happened to build. A build's own host is
  # decided when it is built, never by whoever writes this feed; see
  # lib/src/update/updater.dart, which refuses a path that could leave it.
  feed:
    needs: [version, desktop]
    # A tag's release, not a dry run and not main as it stands.
    if: inputs.tag != '' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Write latest.json from what is in R2
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
          LABEL: ${{ needs.version.outputs.label }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for secret in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            [ -n "$(printenv "$secret")" ] || { echo "::error::The secret behind $secret is not set"; exit 1; }
          done
          r2() { aws --endpoint-url "$R2_ENDPOINT" "$@"; }
          : > "$RUNNER_TEMP/parts.json"
          for target in linux windows macos; do
            case $target in
              linux)   match='-linux-.*\.tar\.gz$' ;;
              windows) match='-windows-.*\.zip$' ;;
              # The zip, not the dmg: it is what the app tells the user to
              # unzip and drag into Applications.
              macos)   match='-macos\.zip$' ;;
            esac
            r2 s3 cp --only-show-errors "s3://$R2_BUCKET/desktop/$target/SHA256SUMS" "$RUNNER_TEMP/sums"
            # -- : every pattern starts with a dash, which grep would read as
            # options of its own.
            name=$(awk '{ print $2 }' "$RUNNER_TEMP/sums" | grep -E -- "$match" | head -n 1)
            [ -n "$name" ] || { echo "::error::no $target build in R2"; exit 1; }
            # R2 keeps only the newest build, so a name that is not this
            # release's is a sync that did not land. Better a red run than a
            # feed that offers this version and hands over the one before,
            # which no amount of updating would ever satisfy.
            case $name in
              *"$LABEL"*) ;;
              *) echo "::error::the $target build in R2 is $name, not this release's $LABEL"; exit 1 ;;
            esac
            sha=$(awk -v n="$name" '$2 == n { print $1 }' "$RUNNER_TEMP/sums")
            size=$(r2 s3api head-object --bucket "$R2_BUCKET" \
              --key "desktop/$target/$name" --query ContentLength --output text)
            jq -n --arg t "$target" --arg p "desktop/$target/$name" \
                  --arg s "$sha" --argjson z "$size" \
              '{($t): {path: $p, size: $z, sha256: $s}}' >> "$RUNNER_TEMP/parts.json"
          done
          jq -n --arg v "$NAME" --argjson b "$BUILD" \
            --slurpfile parts "$RUNNER_TEMP/parts.json" \
            '{version: $v, build: $b, platforms: ($parts | add)}' \
            > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      # An older tag released again by hand becomes the latest release, and so
      # the feed every build reads. It offers a real build and the app updates
      # to nothing older than it is already running, so it is a release that
      # goes quiet rather than one that goes backwards.
      - name: Put it on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Jeansh $NAME" \
              --notes "Jeansh $NAME. The builds are served from Jeansh's own host; this release carries only latest.json, which the app reads to find them." \
              --latest
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber

  notes:
    needs: [version, android, desktop]
    # A tag's release, not a dry run and not main as it stands.
    if: inputs.tag != '' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      # From the app's commits since the previous tag, onto site/releases.json
      # in R2, which jeansh.brata.cloud/releases reads: no deploy per release.
      - name: Write the release notes onto the website
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          TAG: ${{ inputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for secret in OPENROUTER_API_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            [ -n "$(printenv "$secret")" ] || { echo "::error::The secret behind $secret is not set"; exit 1; }
          done
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          git log --no-merges --format='* %s%n%n%b' ${prev:+"$prev.."}"$TAG" -- \
            lib android ios macos linux windows assets third_party pubspec.yaml pubspec.lock \
            > "$RUNNER_TEMP/changes.txt"

          r2() { aws --endpoint-url "$R2_ENDPOINT" "$@"; }
          list="$RUNNER_TEMP/releases.json"
          # No list yet starts one. Any other failure to read it stops here,
          # rather than writing a list that has lost every older release.
          if r2 s3api head-object --bucket "$R2_BUCKET" --key site/releases.json > /dev/null 2> "$RUNNER_TEMP/head.err"; then
            r2 s3 cp --only-show-errors "s3://$R2_BUCKET/site/releases.json" "$list"
          elif grep -qE '\(404\)|Not Found' "$RUNNER_TEMP/head.err"; then
            echo '[]' > "$list"
          else
            echo "::error::could not read the release notes from R2"
            exit 1
          fi
          python3 tool/release_notes.py --version "$NAME" --build "$BUILD" \
            --changes "$RUNNER_TEMP/changes.txt" "$list"
          r2 s3 cp --only-show-errors --content-type application/json \
            "$list" "s3://$R2_BUCKET/site/releases.json"
