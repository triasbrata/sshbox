# On a v* tag, or by hand from the Actions tab. Mobile goes straight to its
# store: `android` runs tool/release.sh --publish, which releases on Play's
# closed testing track (by hand it is a --dry-run unless told otherwise).
# Desktop goes to R2: `desktop` builds Linux, Windows and macOS and keeps them
# in a private bucket, and nowhere else. The secrets live in the `release`
# environment, which only v* tags and main can reach. README.md, Releasing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Android - everything but the commit that reaches testers
        type: boolean
        default: true

permissions:
  contents: read

concurrency: release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7

      # AGP 9 and Gradle 9 need JDK 17 or newer; release.sh needs its keytool.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2 # .fvmrc
          channel: stable
          cache: true

      # compileSdk 37 resolves to the minor-versioned platform android-37.0.
      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0' > /dev/null

      - run: flutter pub get

      - name: Write the signing config and the Play key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for secret in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_KEY; do
            [ -n "$(printenv "$secret")" ] || { echo "::error::The secret behind $secret is not set"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printenv PLAY_KEY > "$RUNNER_TEMP/play.json"
          # A Java properties file: a backslash in a password would need doubling.
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Build and publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play.json
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: tool/release.sh --publish $DRY_RUN

      - name: Remove the signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json" android/key.properties

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
    name: desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2 # .fvmrc
          channel: stable
          cache: true

      - name: Install the Linux build's packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev

      # Each lands in dist/<X.Y.Z+N>/ as the scripts package it by hand.
      - name: Build
        run: |
          label=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          echo "LABEL=$label" >> "$GITHUB_ENV"
          case ${{ matrix.target }} in
            linux) tools/build_desktop.sh --skip-checks linux ;;
            macos) tools/build_apple.sh --skip-checks macos ;;
            # tools/build_desktop.sh builds Windows from WSL; here is Windows
            # itself, so the same build and the same zip, by hand.
            windows)
              flutter build windows --release
              name="Jeansh-$label"
              cp -r build/windows/x64/runner/Release "$RUNNER_TEMP/$name"
              mkdir -p "dist/$label"
              (cd "$RUNNER_TEMP" && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/$label/$name-windows-x64.zip" "$name")
              (cd "dist/$label" && sha256sum -- * > SHA256SUMS) ;;
          esac

      # Into a private bucket, and nowhere else: no Actions artifact, no GitHub
      # release, and nothing in this public log names the bucket or an object.
      - name: Keep the build in R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for secret in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            [ -n "$(printenv "$secret")" ] || { echo "::error::The secret behind $secret is not set"; exit 1; }
          done
          aws s3 cp --recursive --only-show-errors --endpoint-url "$R2_ENDPOINT" \
            "dist/$LABEL" "s3://$R2_BUCKET/desktop/$LABEL/${{ matrix.target }}/"
