# Throwaway: does the experiment branch compile on Linux? Never merged.
name: compileexp
on:
  push:
    branches: [desktop-multi-window-exp]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --debug 2>&1 | tail -60
