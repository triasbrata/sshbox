# CI numbers every release. A push to main that changes the app gets the next
# version: the highest v* tag, annotated "Jeansh X.Y.Z, build N", gives way to
# vX.Y.(Z+1) with build N+1 on the pushed commit, or to X.Y.0 when
# pubspec.yaml's version line asks for a new X.Y by hand. That tag starts
# release.yml. Nothing is committed back: pubspec.yaml's version line only
# sets X.Y, and release.yml writes the whole version into its own copy.
#
# The tag is made with CLAUDE_GITHUB_TOKEN, a token of the repository's owner,
# for two reasons: a tag made with GITHUB_TOKEN starts no other workflow, and
# the v* tag ruleset lets only an admin make one. `next` needs no secret, so
# only a push with something to release touches the release environment.
name: Tag

on:
  push:
    branches: [main]
    # What the app is built from; a push of docs, tests or CI alone is no release.
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'linux/**'
      - 'windows/**'
      - 'assets/**'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

# One at a time, so each run counts from the tag the one before it made.
concurrency: tag

jobs:
  next:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      message: ${{ steps.next.outputs.message }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: next
        run: |
          if [ -n "$(git tag --points-at HEAD 'v[0-9]*')" ]; then
            echo "$(git tag --points-at HEAD 'v[0-9]*') is this commit already"
            exit 0
          fi
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          [ -n "$last" ] || { echo "::error::no vX.Y.Z tag to count from"; exit 1; }
          build=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$last" |
            sed -n 's/^Jeansh .*, build \([0-9][0-9]*\)$/\1/p')
          [ -n "$build" ] || { echo "::error::$last is not annotated \"Jeansh X.Y.Z, build N\""; exit 1; }

          xy=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' pubspec.yaml)
          last_xy=${last#v}
          last_xy=${last_xy%.*}
          if [ "$xy" = "$last_xy" ]; then
            name=$xy.$((${last##*.} + 1))
          else
            name=$xy.0
          fi
          build=$((build + 1))
          if git rev-parse -q --verify "refs/tags/v$name" > /dev/null; then
            echo "::error::v$name is taken, yet it follows $last: is pubspec.yaml's X.Y behind it?"
            exit 1
          fi

          echo "v$name, build $build, after $last"
          {
            echo "tag=v$name"
            echo "message=Jeansh $name, build $build"
          } >> "$GITHUB_OUTPUT"

  tag:
    needs: next
    if: needs.next.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Make the tag
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_GITHUB_TOKEN }}
          TAG: ${{ needs.next.outputs.tag }}
          MESSAGE: ${{ needs.next.outputs.message }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::The secret behind CLAUDE_GITHUB_TOKEN is not set"; exit 1; }
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="$MESSAGE" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          echo "tagged $GITHUB_SHA as $TAG"
