name: Gradle's build cache, from main's
description: >
  Restores Gradle's build cache (~/.gradle/caches/build-cache-1) from what
  main saved, the newest under the given name, and with `save: true` saves
  this run's from main alone. Measured on the Android debug build: 474 MB,
  338 s with it empty and 213 s with it restored. Its keys carry the commit,
  since the outputs change with the code, so each main push adds one; the
  older ones are deleted by the caller's `prune` job, keeping one per name.
inputs:
  name:
    description: Which build this is, as in gradle-build-<name>-.
    required: true
  save:
    description: "'true' after the build, to save it; otherwise it restores."
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.save != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gradle-build-${{ inputs.name }}-${{ github.sha }}
        restore-keys: gradle-build-${{ inputs.name }}-

    # Entries the build did not use go before the save, so a long-lived
    # cache holds what the current code builds and not every older build's
    # outputs. Gradle touches each entry it reads or writes; anything older
    # than the newest hour's work was not part of this build.
    - if: inputs.save == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        dir=~/.gradle/caches/build-cache-1
        [ -d "$dir" ] || exit 0
        find "$dir" -type f -mmin +90 -delete
        echo "gradle build cache: $(du -sh "$dir" | cut -f1) after pruning"

    - if: inputs.save == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gradle-build-${{ inputs.name }}-${{ github.sha }}
