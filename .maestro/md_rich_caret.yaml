# A tap below a code fence in Rich text, the fence shown as its source,
# keeps the line tapped where it was (#340): tools/e2e_android.sh's
# md_rich_caret puts jeansh-e2e-caret.md in the login home, taps and scrolls
# with adb between this flow's steps and measures how far the text under the
# tap moved, from screenshots.
#
# STEP comes from -e alone (see chat_images.yaml):
#   open   the file opened from the drawer, in Rich text
#   close  the file tab closed, with nothing saved
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
  FILE: "jeansh-e2e-caret.md"
---
- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Browse files"
          timeout: 30000
      - tapOn: "Browse files"
      - extendedWaitUntil:
          visible: "Filter by name"
          timeout: 30000
      - tapOn: "Filter by name"
      - inputText: "jeansh-e2e-caret"
      - tapOn: "(?s)\\W*${FILE}"
      - extendedWaitUntil:
          visible: "Save to host"
          timeout: 30000
      - extendedWaitUntil:
          visible: "(?s).*Caret e2e.*"
          timeout: 15000
      - takeScreenshot: md-rich-caret-opened

- runFlow:
    when:
      true: ${STEP == 'close'}
    commands:
      - hideKeyboard
      - tapOn: "Close file"
      - tapOn:
          text: "Discard"
          optional: true
      - waitForAnimationToEnd
