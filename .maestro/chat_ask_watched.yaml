# Claude's questions in chat, for a session chat only WATCHES: a claude --bg
# session and Claude in a tmux pane. Their question is not the chat's to
# answer through the SDK, so Send answers types the picks into the session's
# own dialog (`claude attach`, or the pane), with the keys measured on a real
# 2.1.287: Down and Enter for a choice, Space and Tab for several, words typed
# into "Type something." and the review's Submit answers.
#
# One file, a KIND and a STEP a run: tools/e2e_android.sh's chat_ask_watched
# runs `pre`, then taps Send answers itself with adb (Maestro's own tap on it
# once landed on the composer beneath, opening the photo picker or the
# keyboard, and the run lists every node that matches and what the tap did),
# then `mid` where a kind has a second send, then `post`. Between runs it
# reads what reached the dialog off the stand-in's log
# (tools/e2e_ask_watched.py): the keys, how many attaches, whether the
# session still waits.
#
#   single  pick option 2 -> "Banana", the session goes on
#   multi   a pick with words of one's own is refused, nothing typed; then
#           two ticks -> "Red, Blue"
#   two     two questions in one call
#   other   words with $(touch x) arrive as text
#   perm    the session waits for a permission prompt, not an answer: refused
#   pane    the same as single, into a tmux pane
#
# KIND, STEP and SESSION come from -e alone: Maestro 2.10 lets a flow's own
# env: block win over -e (see tools/e2e_android.sh), so they have no default.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
- runFlow:
    when:
      true: ${STEP == 'pre'}
    commands:
      - pressKey: Home
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Upload a file to /tmp"
          timeout: 30000
      - tapOn: "Chat with Claude"
      - extendedWaitUntil:
          visible: "Sessions on this host"
          timeout: 20000
      - tapOn: "Sessions on this host"
      - extendedWaitUntil:
          visible: "(?s)\\W*${SESSION}.*"
          timeout: 20000
      - tapOn: "(?s)\\W*${SESSION}.*"

# ---- pre: the question is a card, and its picks are made.

- runFlow:
    when:
      true: ${STEP == 'pre' && KIND == 'single'}
    commands:
      - extendedWaitUntil:
          visible: "Which fruit\\?"
          timeout: 30000
      - assertNotVisible: "AskUserQuestion"
      - tapOn: "(?s)Banana.*"
      - assertNotVisible: "No photos or videos"
      - takeScreenshot: chat-ask-watched-picked-Banana

# Words of one's own beside a tick: refused by the next send.
- runFlow:
    when:
      true: ${STEP == 'pre' && KIND == 'multi'}
    commands:
      - extendedWaitUntil:
          visible: "Which colours\\?"
          timeout: 30000
      - tapOn: "(?s)Red.*"
      - assertNotVisible: "No photos or videos"
      - takeScreenshot: chat-ask-watched-picked-Red
      - tapOn: "Other…"
      - inputText: "my own"
      - hideKeyboard

# The card is taller than the screen and the chat sits at its end: the first
# question is above the view, and Send answers below the fold at the end.
- runFlow:
    when:
      true: ${STEP == 'pre' && KIND == 'two'}
    commands:
      - extendedWaitUntil:
          visible: "Send answers"
          timeout: 30000
      - scrollUntilVisible:
          element: "Which size\\?"
          direction: UP
      - waitForAnimationToEnd
      - tapOn: "(?s)Large.*"
      - assertNotVisible: "No photos or videos"
      - takeScreenshot: chat-ask-watched-picked-Large
      - scrollUntilVisible:
          element: "(?s)Circle.*"
      - waitForAnimationToEnd
      - tapOn: "(?s)Circle.*"
      - assertNotVisible: "No photos or videos"
      - takeScreenshot: chat-ask-watched-picked-Circle
      - scrollUntilVisible:
          element: "Send answers"
      - waitForAnimationToEnd

- runFlow:
    when:
      true: ${STEP == 'pre' && KIND == 'other'}
    commands:
      - extendedWaitUntil:
          visible: "Which city\\?"
          timeout: 30000
      - tapOn: "Other…"
      - inputText: "Lisbon $(touch x)"
      - hideKeyboard

- runFlow:
    when:
      true: ${STEP == 'pre' && KIND == 'perm'}
    commands:
      - extendedWaitUntil:
          visible: "Which day\\?"
          timeout: 30000
      - tapOn: "(?s)Friday.*"
      - assertNotVisible: "No photos or videos"
      - takeScreenshot: chat-ask-watched-picked-Friday

- runFlow:
    when:
      true: ${STEP == 'pre' && KIND == 'pane'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*typed into that pane.*"
          timeout: 30000
      - extendedWaitUntil:
          visible: "Which drink\\?"
          timeout: 30000
      - tapOn: "(?s)Coffee.*"
      - assertNotVisible: "No photos or videos"
      - takeScreenshot: chat-ask-watched-picked-Coffee

# Before every send: still, with the button on screen.
- runFlow:
    when:
      true: ${STEP == 'pre'}
    commands:
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Send answers"
          timeout: 10000
      - takeScreenshot: chat-ask-watched-before-send-${KIND}

# ---- mid (multi only): the refusal is on the card; the words come off and
# a second tick goes in.

- runFlow:
    when:
      true: ${STEP == 'mid' && KIND == 'multi'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*Jeansh cannot type this answer.*"
          timeout: 30000
      - assertNotVisible: "No photos or videos"
      - assertNotVisible: "Continuing after your answer\\."
      - assertVisible: "Send answers"
      - takeScreenshot: chat-ask-watched-multi-refused
      - tapOn: "(?s).*my own.*"
      - eraseText: 20
      - hideKeyboard
      - tapOn: "(?s)Blue.*"
      - assertNotVisible: "No photos or videos"
      - takeScreenshot: chat-ask-watched-picked-Blue
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Send answers"
          timeout: 10000
      - takeScreenshot: chat-ask-watched-before-send-multi2

# ---- post: what the card shows once the send is done.

- runFlow:
    when:
      true: ${STEP == 'post' && KIND == 'single'}
    commands:
      - extendedWaitUntil:
          visible: "Continuing after your answer\\."
          timeout: 60000
      - assertVisible: "(?s).*Banana.*"
      - assertNotVisible: "(?s)Cherry.*"
      - assertNotVisible: "Send answers"
      - assertNotVisible: "(?s).*Not answered.*"
      - takeScreenshot: chat-ask-watched-single

- runFlow:
    when:
      true: ${STEP == 'post' && KIND == 'multi'}
    commands:
      - extendedWaitUntil:
          visible: "Continuing after your answer\\."
          timeout: 60000
      - assertVisible: "(?s).*Red, Blue.*"
      - assertNotVisible: "(?s).*Not answered.*"
      - assertNotVisible: "Send answers"
      - takeScreenshot: chat-ask-watched-multi

- runFlow:
    when:
      true: ${STEP == 'post' && KIND == 'two'}
    commands:
      - extendedWaitUntil:
          visible: "Continuing after your answer\\."
          timeout: 60000
      - assertVisible: "(?s).*Large.*"
      - assertVisible: "(?s).*Circle.*"
      - assertNotVisible: "(?s)Small.*"
      - assertNotVisible: "(?s).*Not answered.*"
      - takeScreenshot: chat-ask-watched-two

- runFlow:
    when:
      true: ${STEP == 'post' && KIND == 'other'}
    commands:
      - extendedWaitUntil:
          visible: "Continuing after your answer\\."
          timeout: 60000
      - assertVisible: "(?s).*Lisbon.*touch x.*"
      - assertNotVisible: "(?s).*Not answered.*"
      - takeScreenshot: chat-ask-watched-other

# The session waits for a tool's permission, not for this answer. Said on the
# card, nothing typed (the run checks that no attach was opened), and the
# question is still open.
- runFlow:
    when:
      true: ${STEP == 'post' && KIND == 'perm'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*is not waiting for an answer but for permission prompt.*"
          timeout: 30000
      - assertNotVisible: "No photos or videos"
      - assertVisible: "Send answers"
      - assertVisible: "(?s)Monday.*"
      - assertNotVisible: "Continuing after your answer\\."
      - takeScreenshot: chat-ask-watched-perm

- runFlow:
    when:
      true: ${STEP == 'post' && KIND == 'pane'}
    commands:
      - extendedWaitUntil:
          visible: "Continuing after your answer\\."
          timeout: 60000
      - assertVisible: "(?s).*Coffee.*"
      - assertNotVisible: "(?s)Water.*"
      - assertNotVisible: "(?s).*Not answered.*"
      - takeScreenshot: chat-ask-watched-pane

# No hideKeyboard: with none up it presses Back. The strip is reachable either
# way.
- runFlow:
    when:
      true: ${STEP == 'post'}
    commands:
      - tapOn: "(?s)Close .*Claude.*"
      - tapOn: "Close ${HOST_LABEL}.*"
