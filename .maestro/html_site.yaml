# svgcsp: csp.html sends itself to x.svg, a document of the folder that is
# not HTML. Its script's POST to a listener on the device's own 127.0.0.1
# must not be sent (the runner reads the listener's log afterwards), while the
# same document's same-site fetch, svg-self-marker.css, is made and said
# missing, and its picture from the listener does load.
- runFlow:
    when:
      true: ${STEP == 'svgcsp'}
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Browse files"
          timeout: 30000
      - tapOn: "Browse files"
      - extendedWaitUntil:
          visible: "Filter by name"
          timeout: 30000
      - tapOn: "(?s)\\W*jeansh-e2e-site.*"
      - extendedWaitUntil:
          visible: "(?s)\\W*csp\\.html"
          timeout: 20000
      - longPressOn: "(?s)\\W*csp\\.html"
      - waitForAnimationToEnd:
          timeout: 2000
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn: "Open in browser tab"
      # The svg's script ran: its same-site fetch reached the site.
      - extendedWaitUntil:
          visible: "(?s).*not loaded.*svg-self-marker\\.css.*"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: html-site-svgcsp
      - tapOn:
          text: "(?s)Close .*"
          optional: true
      - tapOn:
          text: "Close ${HOST_LABEL}.*"
          optional: true

# swap: swap.html reads swap.css and stay.css again every 1.5 s, keeping its
# first result on screen as "first ...". After its
# first read it tells the listener, and the runner turns swap.css into a link
# to the secret file beside the folder, with no Reload. swap.css is then
# refused and said to be a link, the secret is nowhere, and stay.css, still a
# file, is still read.
- runFlow:
    when:
      true: ${STEP == 'swap'}
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Browse files"
          timeout: 30000
      - tapOn: "Browse files"
      - extendedWaitUntil:
          visible: "Filter by name"
          timeout: 30000
      - tapOn: "(?s)\\W*jeansh-e2e-site.*"
      - extendedWaitUntil:
          visible: "(?s)\\W*swap\\.html"
          timeout: 20000
      - longPressOn: "(?s)\\W*swap\\.html"
      - waitForAnimationToEnd:
          timeout: 2000
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn: "Open in browser tab"
      - extendedWaitUntil:
          visible: "(?s).*first swap read ORIGINAL-CSS.*"
          timeout: 30000
      # Read again after the runner's change, without Reload.
      - extendedWaitUntil:
          visible: "(?s).*swap refused 403.*"
          timeout: 40000
      - extendedWaitUntil:
          visible: "(?s).*not loaded.*swap\\.css.*a link, not followed.*"
          timeout: 20000
      - assertVisible: "(?s).*stay read STAY-CSS.*"
      - assertNotVisible: "(?s).*SECRET-TOKEN.*"
      - takeScreenshot: html-site-swap
      - tapOn:
          text: "(?s)Close .*"
          optional: true
      - tapOn:
          text: "Close ${HOST_LABEL}.*"
          optional: true
