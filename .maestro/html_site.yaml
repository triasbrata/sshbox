      # The site's folder, in the login home the tree opens at.
      - tapOn: "(?s)\\W*jeansh-e2e-site.*"
      - extendedWaitUntil:
          visible: "(?s)\\W*evil\\.html"
          timeout: 20000
      - longPressOn: "(?s)\\W*evil\\.html"
      - waitForAnimationToEnd:
          timeout: 2000
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn: "Open in browser tab"
      - extendedWaitUntil:
          visible: "(?s).*evil.*"
          timeout: 30000
      # Said, with the file named and why.
      - extendedWaitUntil:
          visible: "(?s).*not loaded.*jeansh-e2e-secret.*outside.*"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 3000
      # Neither the script nor the fetch got it.
      - assertNotVisible: "(?s).*SECRET-TOKEN.*"
      - takeScreenshot: html-site-evil
      # The page's tab is the selected one: closing it lands on the shell.
      - tapOn: "(?s)Close .*"
      - tapOn: "Close ${HOST_LABEL}.*"

