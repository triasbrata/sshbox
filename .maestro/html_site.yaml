          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      # The page asks for the link's text too; what /etc/hostname holds is not
      # on screen.
      - assertNotVisible: "(?s).*${LEAK}.*"
      - takeScreenshot: html-site-link
      # The page's tab is the selected one: closing it lands on the shell.
