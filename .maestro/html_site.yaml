          timeout: 30000
      - tapOn: "Browse files"
      - extendedWaitUntil:
          visible: "Filter by name"
          timeout: 30000
      # The site's folder, in the login home the tree opens at.
      - tapOn: "(?s)\\W*jeansh-e2e-site.*"
      - extendedWaitUntil:
          visible: "(?s)\\W*page\\.html"
          timeout: 20000
      - longPressOn: "(?s)\\W*page\\.html"
      - waitForAnimationToEnd:
          timeout: 2000
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000
      # An HTML file: the glyph can be tapped.
      - assertVisible:
          text: "Open in browser tab"
          enabled: true
      - extendedWaitUntil:
          visible: "(?s)\\W*plain\\.txt"
          timeout: 20000
      - longPressOn: "(?s)\\W*plain\\.txt"
      - waitForAnimationToEnd:
          timeout: 2000
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000
      # A text file: it cannot, and tapping it opens nothing.
      - assertVisible:
          text: "Open in browser tab"
          enabled: false
      - tapOn: "Open in browser tab"
      - assertNotVisible: "Reload"
      - assertVisible: "Filter by name"
      - takeScreenshot: html-site-plaintext
      - tapOn:
          text: "Close files"
          optional: true
      - tapOn:
          text: "Close ${HOST_LABEL}.*"
          optional: true

