          visible: "gate page"
          timeout: 30000
      # Its meta refresh to a mailto: fired with no touch: nothing left, and
      # the web tab is still in front.
      - assertVisible: "Reload"
      - takeScreenshot: html-site-gate
      - assertVisible: "gate page"
      - assertVisible: "Reload"
      # The page's tab is the selected one: closing it lands on the shell.
