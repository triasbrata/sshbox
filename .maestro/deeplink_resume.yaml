# The behaviour a notification tap depends on: `sshbox://host/<id>` opens that
# host's terminal page. This is exactly the payload a notification carries, so
# it covers the tap path without needing a push to arrive first.
#
# Deliberately asserts only on navigation, not on the shell coming up, so it
# stays meaningful on a device that cannot reach the host — routing is what is
# under test here, not connectivity.
#
# HOST_ID below is per device, not per project: ids are generated when a host
# is added, so the emulator's entry and the phone's are different rows with
# different ids. Pointed at an id the device does not have, this lands on the
# host list and fails at the assertions — which looks like a regression in the
# terminal page and is not one. Set it to an id that exists on the device
# under test.
appId: cloud.brata.terminal
env:
  HOST_ID: "wsl-emu"
  HOST_LABEL: "WSL via"
---
- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "(?s)${HOST_LABEL}.*"
    timeout: 15000

- openLink: "sshbox://host/${HOST_ID}"

# Not asserted on the label: the tab takes the title the remote reports as
# soon as the shell is up, so the host's own name is gone from the screen the
# moment the link works.
#
# These two buttons only exist on the terminal page, where they open the key
# bar whether or not the shell is up, so their presence is what distinguishes
# it from the host list.
- extendedWaitUntil:
    visible: "Upload a file to /tmp"
    timeout: 20000
- assertVisible: "Browse files"
