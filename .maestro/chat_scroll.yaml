# Chat comes back where it was left (UAT issue #17), in the user's own steps:
# "user open dormant session scroll sedikit - user pindah session, - user
# balik ke session sebelumnya posisinya sudah berpindah ke chat terakhir" —
# a finished session scrolled up a little, another picked, the first picked
# again, and it was back at its last message.
#
# The sessions are a stand-in's, from tools/e2e_android.sh's chat_stand_in:
# "E2E long session" is sixty one-line answers, so a small scroll moves
# several of them. The place is the topmost answer on screen, taken before
# leaving and again on coming back; they must be the same answer.
#
# The scroll is small on purpose, and slow so nothing flings: the fault was
# that anything within 240 dp of the end counted as left at the bottom and
# was thrown away, so a scroll past that would have passed on the broken
# build too.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: '(?s).*${HOST_LABEL}.*\n.*'
    timeout: 15000
- tapOn: '(?s).*${HOST_LABEL}.*\n.*'
- tapOn:
    text: "Trust"
    optional: true
- extendedWaitUntil:
    visible: "Upload a file to /tmp"
    timeout: 30000

- tapOn: "Chat with Claude"
- extendedWaitUntil:
    visible: "Sessions on this host"
    timeout: 20000
- tapOn: "Sessions on this host"
- extendedWaitUntil:
    visible: "(?s)E2E long session.*"
    timeout: 20000
- tapOn: "(?s)E2E long session.*"
# A session opens at its end.
- extendedWaitUntil:
    visible: "Answer 60 of the long session"
    timeout: 20000

- swipe:
    start: "50%, 45%"
    end: "50%, 65%"
    duration: 2000
- waitForAnimationToEnd
- copyTextFrom:
    text: "Answer \\d+ of the long session"
- evalScript: ${output.place = maestro.copiedText}

- tapOn: "Sessions on this host"
- tapOn: "(?s)E2E short session.*"
- extendedWaitUntil:
    visible: "Short answer of the short session"
    timeout: 20000

- tapOn: "Sessions on this host"
- tapOn: "(?s)E2E long session.*"
- extendedWaitUntil:
    visible: "Answer \\d+ of the long session"
    timeout: 20000
# The place is put back a frame at a time until it lands.
- waitForAnimationToEnd
- copyTextFrom:
    text: "Answer \\d+ of the long session"
- assertTrue:
    condition: ${output.place == maestro.copiedText}
    label: "back at ${output.place}, not at the last message"

- tapOn: "(?s)Close .*Claude.*"
- tapOn: "Close ${HOST_LABEL}.*"
