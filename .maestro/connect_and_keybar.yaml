# Opens a host and checks the accessory key bar is actually there.
#
# The keys only render once the session reports connected, so asserting on
# them doubles as an assertion that SSH authentication succeeded — no
# separate "did it connect" check needed.
#
# Requires a reachable host with a stored credential. On a device where the
# password has never been entered this fails at the key bar, which is the
# correct result rather than a flaky one.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: '(?s).*${HOST_LABEL}.*\n.*'
    timeout: 15000

- tapOn: '(?s).*${HOST_LABEL}.*\n.*'

# The first connection to a host this device has never seen puts up the trust
# prompt, and nothing else in this flow would ever press it. Optional, so a
# device that already trusts the key -- the seeded case -- passes straight
# through rather than failing on a prompt that correctly never came.
- tapOn:
    text: "Trust"
    optional: true

# Generous: this is a real SSH handshake over the network. ESC is the first key
# and renders only once the session reports connected, so seeing it is the
# proof that authentication worked.
- extendedWaitUntil:
    visible: "ESC"
    timeout: 30000

# The bar scrolls sideways, and on a phone-width screen it ends at ESC -- the
# gate's emulator is 320 dp wide, where the five buttons before it take the
# room. So CTRL and ALT, two keys further, were really there and simply off
# screen, and Maestro sees only what is on it. One swipe that STARTS ON ESC
# brings them in; starting on the key rather than at a fixed point keeps it
# right whether the soft keyboard is up, pushing the bar halfway up the screen,
# or down.
- swipe:
    from:
      text: "ESC"
    direction: LEFT
- assertVisible: "CTRL"
- assertVisible: "ALT"

# PGUP used to be asserted here too. It is eleven keys past ALT, and reaching it
# on a phone would mean a chain of swipes on every release, each one a way for
# the gate to fail that says nothing about the build. That the default bar
# carries it is a layout fact, not a platform one, and a widget test holds it:
# key_bar_test.dart, "the default bar carries its modifiers and paging keys",
# which fails if pgup leaves the default.

# Close the session, so the next flow does not relaunch into a restored tab.
# A tab left live survives the app being stopped and comes back on the strip
# with its close button named after the host -- which is how the "dead tap"
# came about, a host selector matching that button. Optional here and only
# here: this flow gates releases, closing a tab is housekeeping rather than
# what it tests, and a gate must never fail on its own tidying up.
- tapOn:
    text: "Close ${HOST_LABEL}.*"
    optional: true
