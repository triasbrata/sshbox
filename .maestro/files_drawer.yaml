# The folder button opens a drawer on the remote filesystem.
#
# Browsing runs over the session, so this flow needs a host it can actually
# reach and log in to — that is why it waits for the key bar first, the same
# way connect_and_keybar proves a connection. Landing in the login directory
# is what proves the SFTP side works end to end; which files are in there is
# the host's business, not the flow's.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "(?s)${HOST_LABEL}.*"
    timeout: 15000
- tapOn: "(?s)${HOST_LABEL}.*"

# The key bar renders only once the shell is connected.
- extendedWaitUntil:
    visible: "CTRL"
    timeout: 40000

- tapOn: "Browse files"

# The drawer's own controls: it opened, and it knows where it is standing.
- extendedWaitUntil:
    visible: "Up"
    timeout: 20000
- assertVisible: "Reload"
