# Copy code on a chat tool row's blocks (#163): an opened Bash row has two,
# its command's and its result's, and each puts exactly its block's text on
# the clipboard, with a "Copied code block" toast.
#
# The session is a stand-in's, from tools/e2e_android.sh's chat_stand_in:
# "E2E tool rows" ran `echo hi`, which answered `hi from e2e`. What a button
# copied is pasted into the chat's box, empty before each, and read back by
# the script from Android's view tree, since the row shows the same text.
#
# STEP comes from -e alone (see chat_images.yaml): `open` opens the row and
# pastes the first block's copy; `second` the second's; `reply` a reply's
# code block's; `select` a word of the reply, long-pressed and copied.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Upload a file to /tmp"
          timeout: 30000
      - tapOn: "Chat with Claude"
      - extendedWaitUntil:
          visible: "Sessions on this host"
          timeout: 20000
      - tapOn: "Sessions on this host"
      - extendedWaitUntil:
          visible: "(?s)\\W*E2E tool rows.*"
          timeout: 20000
      - tapOn: "(?s)\\W*E2E tool rows.*"
      - extendedWaitUntil:
          visible: "Tools done"
          timeout: 20000
      - tapOn: "(?s)\\W*Bash.*"
      - extendedWaitUntil:
          visible: "List the e2e folder"
          timeout: 5000
      # One in the command's block and one in the result's: the Write row
      # stays shut, so these two are the Bash row's.
      - assertVisible:
          text: "Copy code"
          index: 1
      - takeScreenshot: chat-code-copy-row
      - tapOn:
          text: "Copy code"
          index: 0
      - extendedWaitUntil:
          visible: "(?s).*Copied code block.*"
          timeout: 5000
      - extendedWaitUntil:
          visible: "Ask Claude…"
          timeout: 20000
      - longPressOn: "Ask Claude…"
      - tapOn: "Paste"

- runFlow:
    when:
      true: ${STEP == 'second'}
    commands:
      - eraseText: 40
      - tapOn:
          text: "Copy code"
          index: 1
      - extendedWaitUntil:
          visible: "(?s).*Copied code block.*"
          timeout: 5000
      - longPressOn: "Ask Claude…"
      - tapOn: "Paste"

# reply: a code block in Claude's reply has its own Copy code.
- runFlow:
    when:
      true: ${STEP == 'reply'}
    commands:
      - eraseText: 40
      - tapOn: "Sessions on this host"
      - extendedWaitUntil:
          visible: "(?s)\\W*E2E code reply.*"
          timeout: 20000
      - tapOn: "(?s)\\W*E2E code reply.*"
      - extendedWaitUntil:
          visible: "e2eword"
          timeout: 20000
      - takeScreenshot: chat-code-copy-reply
      - tapOn: "Copy code"
      - extendedWaitUntil:
          visible: "(?s).*Copied code block.*"
          timeout: 5000
      - extendedWaitUntil:
          visible: "Ask Claude…"
          timeout: 20000
      - longPressOn: "Ask Claude…"
      - tapOn: "Paste"

# select: a long press on a word of the reply selects it, and the toolbar's
# Copy copies it.
- runFlow:
    when:
      true: ${STEP == 'select'}
    commands:
      - eraseText: 40
      - longPressOn: "e2eword"
      - tapOn: "Copy"
      - longPressOn: "Ask Claude…"
      - tapOn: "Paste"

- runFlow:
    when:
      true: ${STEP == 'done'}
    commands:
      - eraseText: 40
      - tapOn: "(?s)Close .*Claude.*"
      - tapOn: "Close ${HOST_LABEL}.*"
