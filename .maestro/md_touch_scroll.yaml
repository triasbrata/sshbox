# A long Markdown file in Rich text, scrolled by a finger: tools/e2e_android.sh's
# md_touch_scroll puts jeansh-e2e-scroll.md in the login home, and does the
# swipes and reads the page with adb between this flow's steps.
#
# STEP comes from -e alone (see chat_images.yaml):
#   open   the file opened from the drawer, in Rich text, nothing to save
#   close  the file tab closed, nothing having changed
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
  FILE: "jeansh-e2e-scroll.md"
---
- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Browse files"
          timeout: 30000
      - tapOn: "Browse files"
      - extendedWaitUntil:
          visible: "Filter by name"
          timeout: 30000
      - tapOn: "Filter by name"
      - inputText: "jeansh-e2e-scroll"
      # \W*: the redesign draws a glyph before each name in the tree.
      - tapOn: "(?s)\\W*${FILE}"
      - extendedWaitUntil:
          visible: "Save to host"
          timeout: 20000
      - extendedWaitUntil:
          visible: "(?s).*Scroll e2e top\\..*"
          timeout: 10000
      - assertVisible:
          text: "Save to host"
          enabled: false
      - takeScreenshot: md-touch-scroll-opened

- runFlow:
    when:
      true: ${STEP == 'close'}
    commands:
      - hideKeyboard
      - waitForAnimationToEnd
      # Nothing typed, so nothing to save and no question.
      - assertNotVisible: "(?s).*Unsaved changes.*"
      - tapOn: "Close file"
      - waitForAnimationToEnd
