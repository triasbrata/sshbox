# On a tablet the file list arrives as a drawer, not as a screen of its own.
#
# "Close files" is the tell: the embedded listing carries a close button, while
# the phone's full-page version has an implied back arrow instead. Asserting on
# it distinguishes the two layouts without needing to know anything about which
# files the host happens to have.
#
# What happens next — choosing a file splits the screen, terminal on the left —
# is covered by test/workbench_test.dart, which checks the geometry without
# needing a server at all.
#
# Needs a device at least 840dp wide. On a phone this flow fails at the drawer
# assertion, which is the correct answer rather than a flaky one: a phone in
# landscape is 800dp and deliberately stays one pane.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "(?s)${HOST_LABEL}.*"
    timeout: 15000

- tapOn: "(?s)${HOST_LABEL}.*"

# The key bar renders only on a live session, so this is the connected gate.
- extendedWaitUntil:
    visible: "ESC"
    timeout: 30000

- tapOn: "Browse files"

- extendedWaitUntil:
    visible: "Close files"
    timeout: 20000

# The listing itself is the same widget as on a phone, so its own chrome should
# all be here too.
- assertVisible: "Filter by name"
- assertVisible: "Actions"
- assertNotVisible: "Try again"
