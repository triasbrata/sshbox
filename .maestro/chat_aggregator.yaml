# A message to a watched Claude Code session goes through the host helper
# (jeansh-agg.py, which the app installs), not into its terminal, and what the
# helper delivered reads back as the user's own bubble. #345, parts B and C.
#
# One file, a section a STEP: tools/e2e_android.sh's chat_aggregator sets the
# stand-in session's control file (idle or busy, recording or not) and its
# settings, runs a section, and reads on the host what the session's socket
# was given and what its transcript holds. Only `open` launches the app.
#
# STEP, SESSION, MSG, SEE and GONE come from -e alone: Maestro 2.10 lets a
# flow's own env: block win over -e (see tools/e2e_android.sh), so they have
# none.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
# open: the host, its chat, and the session SESSION picked.
- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Chat with Claude"
          timeout: 30000
      - tapOn: "Chat with Claude"
      - extendedWaitUntil:
          visible: "Sessions on this host"
          timeout: 20000
      - tapOn: "Sessions on this host"
      - extendedWaitUntil:
          visible: "(?s)\\W*${SESSION}.*"
          timeout: 20000
      - tapOn: "(?s)\\W*${SESSION}.*"
      - extendedWaitUntil:
          visible: "Message “${SESSION}”…"
          timeout: 30000

# send: MSG typed and sent, then SEE on screen.
- runFlow:
    when:
      true: ${STEP == 'send'}
    commands:
      - tapOn: "Message “${SESSION}”…"
      - inputText: ${MSG}
      - tapOn: "Send"
      - hideKeyboard
      - extendedWaitUntil:
          visible: "(?s).*${SEE}.*"
          timeout: 60000
      - takeScreenshot: chat-aggregator-${SHOT}

# see: SEE on screen, with nothing sent.
- runFlow:
    when:
      true: ${STEP == 'see'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*${SEE}.*"
          timeout: 60000
      - takeScreenshot: chat-aggregator-${SHOT}

# gone: GONE is not on screen, though it has had its time to be.
- runFlow:
    when:
      true: ${STEP == 'gone'}
    commands:
      - extendedWaitUntil:
          notVisible: "(?s).*${GONE}.*"
          timeout: 20000
      - takeScreenshot: chat-aggregator-${SHOT}
