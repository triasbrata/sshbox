# Opens the file drawer and checks a listing actually came back.
#
# Reaching this screen at all means the session connected, SFTP opened and a
# directory was read, so the assertions below are deliberately about the page's
# own chrome rather than about any file: which files exist is the host's
# business and differs per device, but "we got a listing rather than an error"
# is the same everywhere.
#
# Requires a reachable host with a stored credential, like connect_and_keybar.
# On a device where no password was ever entered, a Tailscale-auth host is the
# credential-free way to run this: it sends nothing and tailscaled decides.
# Retarget by editing HOST_LABEL below rather than passing -e, because a flow's
# own env block wins over the CLI flag.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "(?s)${HOST_LABEL}.*"
    timeout: 15000

- tapOn: "(?s)${HOST_LABEL}.*"

# The key bar only renders on a live session, so this is the "connected" gate.
- extendedWaitUntil:
    visible: "ESC"
    timeout: 30000

# The terminal's own app bar, checked before leaving it: these two are the
# icons that survived the move of reconnect and disconnect into a menu.
- assertVisible: "Upload a file to /tmp"
- assertVisible: "Browse files"

- tapOn: "Browse files"

# Only the browser page has these, so they distinguish it from the terminal.
- extendedWaitUntil:
    visible: "Filter by name"
    timeout: 20000
- assertVisible: "Actions"

# The error state offers this button. Its absence is how we assert the listing
# loaded rather than failing — an empty home directory would still pass, which
# is correct: that is a listing too.
- assertNotVisible: "Try again"

# The listing is a drawer at every size, so it carries a close button rather
# than a back arrow. Tapping outside it is the one-gesture way back to the
# terminal from however deep in the tree you had wandered.
- assertVisible: "Close files"

# Creating and deleting are one menu away, and the menu opening proves the page
# is interactive rather than stuck behind a spinner.
- tapOn: "More"
- assertVisible: "New folder"
- assertVisible: "Show dotfiles"
