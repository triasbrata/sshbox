# Opens the file drawer and checks a listing actually came back.
#
# Reaching this screen at all means the session connected, SFTP opened and a
# directory was read, so the assertions below are deliberately about the page's
# own chrome rather than about any file: which files exist is the host's
# business and differs per device, but "we got a listing rather than an error"
# is the same everywhere.
#
# Requires a reachable host with a stored credential, like connect_and_keybar.
# On a device where no password was ever entered, a Tailscale-auth host is the
# credential-free way to run this: it sends nothing and tailscaled decides.
# Retarget by editing HOST_LABEL below rather than passing -e, because a flow's
# own env block wins over the CLI flag.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: '(?s).*${HOST_LABEL}.*\n.*'
    timeout: 15000

- tapOn: '(?s).*${HOST_LABEL}.*\n.*'

# The first connection to a host this device has never seen puts up the trust
# prompt, and nothing else in this flow would ever press it. Optional, so a
# device that already trusts the key -- the seeded case -- passes straight
# through rather than failing on a prompt that correctly never came.
- tapOn:
    text: "Trust"
    optional: true

# The keys only render on a live session, so this is the "connected" gate.
- extendedWaitUntil:
    visible: "ESC"
    timeout: 30000

# The terminal's own buttons, at the front of the key bar, checked before
# leaving it.
- assertVisible: "Upload a file to /tmp"
- assertVisible: "Browse files"

- tapOn: "Browse files"

# Only the file tree has these, so they distinguish it from the terminal:
# the filter in its title bar, and collapse on the root's header.
- extendedWaitUntil:
    visible: "Filter by name"
    timeout: 20000
- assertVisible: "Collapse all"

# The error state offers this button. Its absence is how we assert the listing
# loaded rather than failing — an empty home directory would still pass, which
# is correct: that is a listing too.
- assertNotVisible: "Try again"

# The listing is a drawer at every size, so it carries a close button rather
# than a back arrow. Tapping outside it is the one-gesture way back to the
# terminal from however deep in the tree you had wandered.
- assertVisible: "Close files"

# The overflow menu opening proves the page is interactive rather than stuck
# behind a spinner. The redesign has no overflow here, the dotfiles toggle
# sitting in the drawer's own bar, which proves as much by being there.
- runFlow:
    when:
      notVisible: "Show dotfiles"
    commands:
      - tapOn: "More"
- assertVisible: "Show dotfiles"

# Put it all away and close the session, so the next flow does not relaunch
# into a restored tab (see connect_and_keybar). Back takes the menu down; the
# drawer's close is optional in case Back took the drawer with it; the tab's
# close is not, since leaving the session live is the thing to avoid.
- pressKey: Back
- tapOn:
    text: "Close files"
    optional: true
- tapOn: "Close ${HOST_LABEL}.*"
