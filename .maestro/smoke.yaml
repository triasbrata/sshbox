# Does the app start and show the host list?
#
# HOST_LABEL is what every flow matches the host row on. It CANNOT be
# overridden with -e: in Maestro 2.10 a flow's own `env:` block is applied
# after the command line's, so `maestro test -e HOST_LABEL=...` is silently
# ignored and the default below wins. This comment used to say the opposite,
# and the first CI run of the release gate showed which was true. To use
# another label, edit the default -- in every flow at once, since they have to
# agree.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
# launchApp on a running app only brings it forward, leaving whatever route
# the previous flow ended on. Stopping first is what makes these flows
# independent of the order they run in.
- stopApp
- launchApp:
    clearState: false

# The title and its tagline may read as one node, like the ListTile below.
- assertVisible: "(?s)Jeansh.*"

# Flutter merges a ListTile's title and subtitle into one accessibility node,
# so the row reads as "WSL via …\ntriasbrata@… · password". Maestro
# regex-matches the whole string, hence the (?s) for DOTALL and the wildcard.
# The host list also loads asynchronously, so this needs a timeout.
- extendedWaitUntil:
    visible: "(?s)${HOST_LABEL}.*"
    timeout: 15000
