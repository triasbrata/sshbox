# Creates the host every other flow needs, and trusts its key once.
#
# Run this FIRST on a clean device. Every flow but smoke and deeplink_resume
# waits on a host row matching HOST_LABEL, and on a fresh emulator there is no
# such row — so without this they all fail at their first extendedWaitUntil,
# for a reason that has nothing to do with the build under test.
#
# It seeds through the UI rather than by pushing a preferences file, because
# the UI path is itself worth exercising: the Add sheet, the host editor and
# the trust prompt are all features the user has passed, and a seed that wrote
# storage directly would skip them and rot the moment the editor changed.
#
# The last steps connect once, so the host-key prompt is answered here and the
# key is pinned. Every other flow still carries an optional Trust tap, so they
# work whether or not this one ran — but they are deterministic after it.
#
#   maestro test \
#     -e SSH_HOST=10.0.2.2 -e SSH_PORT=22 \
#     -e SSH_USER=<user> -e SSH_PASSWORD=<password> \
#     .maestro/seed_host.yaml
#
# 10.0.2.2 is how an emulator reaches the machine running it, which is where
# CI's own sshd listens. test/ssh_transport_live_test.dart already handshakes
# against that same sshd, so the server half is a known quantity.
# No defaults for the connection, on purpose. In Maestro 2.10 a flow's own
# `env:` block is applied AFTER the -e values on the command line, so a default
# written here silently beats what the caller passed: the first CI run typed
# the defaults "runner"/"runner" in place of the runner's real credentials,
# which would have failed sign-in with nothing saying why. Leaving them out
# means -e is the only source, and a missing one fails loudly as literal text.
#
# HOST_LABEL keeps its default because every other flow defaults it to the same
# "WSL via" and matches on it; defaulted here too, the two always agree.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
# clearState, unlike every other flow: this one is what makes the state the
# others rely on, so it must not inherit a half-made host from a failed run.
- stopApp
- launchApp:
    clearState: true

# A fresh install shows the onboarding pager once before Home, where the
# build has one; its Skip is labelled "Skip" whatever case it is drawn in.
# Waiting for either makes the check below immediate, and with no pager the
# optional tap finds nothing and moves on.
- extendedWaitUntil:
    visible: "(Skip|Add)"
    timeout: 15000
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible: "Add"
    timeout: 15000

- tapOn: "Add"
- tapOn: "Host"

# The label is typed until it is seen in its field. Run 35700679458 saved the
# host with no label at all -- the card read e2e@10.0.2.2 -- while Maestro
# reported the text typed, and every field after it landed: the first field of
# an editor still sliding in can take the tap and lose the text. With no label
# no flow finds the host, so one lost keystroke failed the release gate. A
# label that cannot be typed at all still fails here, after the retries.
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Label"
      - eraseText
      - inputText: "${HOST_LABEL} tailnet"
      - assertVisible: "(?s).*${HOST_LABEL} tailnet.*"

- tapOn: "Host"
- inputText: "${SSH_HOST}"

# Each field is scrolled to before it is tapped. The keyboard is up from here
# on, and whatever sits under Host decides whether Port is still above it: run
# 35760501957 lost Port behind the keyboard once the Alternative address helper
# grew to a paragraph. Where a field is already in view, this scrolls nothing.
- scrollUntilVisible:
    element:
      text: "Port"
    direction: DOWN
- tapOn: "Port"
- eraseText
- inputText: "${SSH_PORT}"

- scrollUntilVisible:
    element:
      text: "Username"
    direction: DOWN
- tapOn: "Username"
- inputText: "${SSH_USER}"

# The keyboard is up from typing the username and covers the lower half of a
# long form; the whole auth section sits below it, so Maestro -- which sees
# only what is on screen -- found no "Password" at all. Put the keyboard away
# and bring the method's segments to the middle, which leaves the field just
# beneath them in view. "Key" is the anchor because on this screen, in password
# mode, it names only that segment.
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Key"
    direction: DOWN
    centerElement: true

# "Password" names two things here: the auth method's segment and, below it,
# the field itself. Maestro takes the first match, so a plain tapOn "Password"
# lands on the segment and the text goes nowhere. Password is already the
# default method, so the segment needs no tap; the field is the second match.
- tapOn:
    text: "Password"
    index: 1
- inputText: "${SSH_PASSWORD}"

- tapOn: "Save"

# The row now exists, which is the whole point of the flow.
- extendedWaitUntil:
    visible: '(?s).*${HOST_LABEL}.*\n.*'
    timeout: 15000

# Connect once so the key is pinned and the prompt never interrupts a later
# flow. Not optional here: on a clean device this prompt MUST appear, and if it
# does not, something is wrong with the host key check that the other flows
# would then silently skip past.
- tapOn: '(?s).*${HOST_LABEL}.*\n.*'
- extendedWaitUntil:
    visible: "Trust"
    timeout: 20000
- tapOn: "Trust"

# A live session: the key bar only renders once the session reports connected,
# so this doubles as proof the credential works before any other flow leans on
# it.
- extendedWaitUntil:
    visible: "Upload a file to /tmp"
    timeout: 20000

# Leave the device on the host list with the session closed, so every flow
# after this one starts from the same place.
- tapOn: "(?s)Close .*"
- assertVisible: '(?s).*${HOST_LABEL}.*\n.*'
