# Typing into a running `claude --bg` session through `claude attach`: a
# message goes in once its turn is over though a shell of its still runs, is
# held as Queued while it is mid-turn, and is never typed after a draft
# somebody left in its input line at a terminal.
#
# One file, a section a STEP: tools/e2e_android.sh's chat_attach_deliver sets
# the session's row in the stand-in listing and its draft, runs a section,
# and reads on the host what reached the stand-in's input line
# (~/.e2e-pics.log). Only `open` launches the app.
#
# STEP, SESSION, MSG and SEE come from -e alone: Maestro 2.10 lets a flow's
# own env: block win over -e (see tools/e2e_android.sh), so they have none.
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
---
# open: the host, its chat, and the session SESSION picked.
- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Chat with Claude"
          timeout: 30000
      - tapOn: "Chat with Claude"
      - extendedWaitUntil:
          visible: "Sessions on this host"
          timeout: 20000
      - tapOn: "Sessions on this host"
      - extendedWaitUntil:
          visible: "(?s)\\W*${SESSION}.*"
          timeout: 20000
      - tapOn: "(?s)\\W*${SESSION}.*"
      - extendedWaitUntil:
          visible: "Message “${SESSION}”…"
          timeout: 30000

# send: MSG typed and sent, then SEE on screen.
- runFlow:
    when:
      true: ${STEP == 'send'}
    commands:
      - tapOn: "Message “${SESSION}”…"
      - inputText: ${MSG}
      - tapOn: "Send"
      - hideKeyboard
      - extendedWaitUntil:
          visible: "(?s).*${SEE}.*"
          timeout: 45000
      - takeScreenshot: chat-attach-${SHOT}

# see: SEE on screen, with nothing sent.
- runFlow:
    when:
      true: ${STEP == 'see'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*${SEE}.*"
          timeout: 45000
      - takeScreenshot: chat-attach-${SHOT}
