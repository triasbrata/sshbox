# A Markdown file edited as one live document (Rich text): tools/e2e_android.sh's
# md_rich_text puts jeansh-e2e-rich.md in the login home, sends the keys with
# adb between this flow's steps and reads the file on the host, which holds
# the proof: only the bytes typed, bolded and ticked changed, every other byte
# as it was ("* first item" and "- second item" keep their markers, "*plain*"
# its stars, the table its pipes).
#
# STEP comes from -e alone (see chat_images.yaml):
#   open   the file opened from the drawer, in Rich text, nothing to save
#   focus  the text tapped, for the caret and the keyboard
#   tick   the task's box tapped
#   save   Unsaved changes, then Save to host and nothing unsaved
#   close  the file tab closed
appId: cloud.brata.terminal
env:
  HOST_LABEL: "WSL via"
  FILE: "jeansh-e2e-rich.md"
---
- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: '(?s).*${HOST_LABEL}.*\n.*'
          timeout: 15000
      - tapOn: '(?s).*${HOST_LABEL}.*\n.*'
      - tapOn:
          text: "Trust"
          optional: true
      - extendedWaitUntil:
          visible: "Browse files"
          timeout: 30000
      - tapOn: "Browse files"
      - extendedWaitUntil:
          visible: "Filter by name"
          timeout: 30000
      - tapOn: "Filter by name"
      - inputText: "jeansh-e2e-rich"
      # \W*: the redesign draws a glyph before each name in the tree.
      - tapOn: "(?s)\\W*${FILE}"
      - extendedWaitUntil:
          visible: "Save to host"
          timeout: 20000
      # Opened in Rich text: one document, the task drawn as a box to tick.
      - extendedWaitUntil:
          visible: "(?s).*paragraph here\\..*"
          timeout: 10000
      - assertVisible: "task box"
      # Opened, not edited: nothing to save.
      - assertVisible:
          text: "Save to host"
          enabled: false
      - assertNotVisible: "(?s).*Unsaved changes.*"
      - takeScreenshot: md-rich-text-opened

- runFlow:
    when:
      true: ${STEP == 'focus'}
    commands:
      - tapOn: "(?s).*paragraph here\\..*"
      - waitForAnimationToEnd

- runFlow:
    when:
      true: ${STEP == 'tick'}
    commands:
      - tapOn: "task box"
      - waitForAnimationToEnd

- runFlow:
    when:
      true: ${STEP == 'save'}
    commands:
      - extendedWaitUntil:
          visible: "(?s).*Unsaved changes.*"
          timeout: 5000
      - takeScreenshot: md-rich-text-edited
      - tapOn: "Save to host"
      - extendedWaitUntil:
          notVisible: "(?s).*Unsaved changes.*"
          timeout: 10000
      - takeScreenshot: md-rich-text-saved

- runFlow:
    when:
      true: ${STEP == 'close'}
    commands:
      # Saved, so it closes with no question.
      - tapOn: "Close file"
      - waitForAnimationToEnd
